    <script>
        function sendvalue() {
            const name     = $('#user_name').val().trim();
            const email    = $('#user_email').val().trim();
            const password = $('#user_password').val().trim();

            if (!name || !email || !password) {
                $('#result').removeClass('success').addClass('error').text('Please fill in all fields.');
                return;
            }

            $.ajax({
                url: 'signup_backend.php',
                method: 'POST',
                data: {
                    user_name: name,
                    user_email: email,
                    user_password: password
                },
                success: function(response) {
                    $('#result').removeClass('error').addClass('success').text('You are signed up successfully!');
                },
                error: function() {
                    $('#result').removeClass('success').addClass('error').text('Something went wrong. Please try again.');
                }
            });
        }
    </script>
